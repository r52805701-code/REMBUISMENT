const SYC=CL.filter(c=>c!=="sessions").concat("assets");
let SY=null,syBusy=0,syT=null,syVer=0;
const sy=()=>{if(!SY){try{SY=JSON.parse(localStorage.getItem("rb_sy"))||{}}catch(e){SY={}}SY.gh=SY.gh||{};SY.tb=SY.tb||{};if(!SY.v2){SY.h={};SY.sha={};SY.v2=1;delete SY.fb;delete SY.inc}SY.h=SY.h||{};SY.sha=SY.sha||{}}return SY};
const sySave=()=>{try{localStorage.setItem("rb_sy",JSON.stringify(sy()))}catch(e){}};
const hsh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))>>>0;return h+":"+t.length};
async function th(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return hsh(t)}}
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const syTxt=it=>"[\n"+it.slice().sort((a,b)=>String(a.k).localeCompare(String(b.k))).map(x=>sj(x)).join(",\n")+"\n]\n";
const b64enc=s=>{const b=new TextEncoder().encode(s);let o="";for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)};

const tbAdd=(col,k)=>{if(col==="sessions")return;const S=sy();S.tb[col+":"+k]=Date.now();const ks=Object.keys(S.tb);if(ks.length>5000)ks.sort((a,b)=>S.tb[a]-S.tb[b]).slice(0,ks.length-5000).forEach(x=>delete S.tb[x]);sySave()};
const tbClr=(col,k)=>{const S=sy();if(S.tb[col+":"+k]!==undefined){delete S.tb[col+":"+k];sySave()}};
function syChange(col,k,del){if(col==="sessions")return;syVer++;if(del)tbAdd(col,k);else tbClr(col,k);if(!ghOn())return;sy().dirty=1;sySave();ghBadge();ghKick()}
function syFiles(){const S=sy(),m={};SYC.forEach(c=>{db[c].forEach(o=>{const n=c==="rows"?"rows-"+((String(o.tgl||"").match(/^\d{4}-\d{2}/)||["undated"])[0]):c==="assets"?"assets-"+String(o.k).replace(/[^\w-]/g,"_"):c;(m[n]=m[n]||[]).push(o)})});const tb=Object.entries(S.tb).map(([k,t])=>({k,t}));if(tb.length)m._deleted=tb;return m}
function syCol(n){const c=/^rows-[\w-]+$/.test(n)?"rows":/^assets-[\w-]+$/.test(n)?"assets":n;if(!SYC.includes(c)||c==="rows"&&!/^rows-/.test(n))return null;return c}

async function syMerge(col,it,force){const S=sy(),L=[];(Array.isArray(it)?it:Object.values(it||{})).forEach(x=>{if(!x||x.k===undefined)return;x=syNorm(col,x);const tb=S.tb[col+":"+x.k],u=+x._u||0;
 if(!force&&tb!==undefined&&tb>=u)return;
 const o=db[col].find(y=>String(y.k)===String(x.k));if(!o){L.push(x);return}
 if(sj(o)===sj(x))return;if(force||u>(+o._u||0))L.push(x)});
 await pAll(L,x=>{tbClr(col,x.k);db[col]=db[col].filter(y=>String(y.k)!==String(x.k));db[col].push(x);return putRaw(col,String(x.k),x)});return L.length}
async function syMergeTb(it){const S=sy(),D=[];(Array.isArray(it)?it:[]).forEach(x=>{if(!x||!x.k||!(+x.t))return;const i=String(x.k).indexOf(":");if(i<1)return;const col=String(x.k).slice(0,i),k=String(x.k).slice(i+1);if(!SYC.includes(col))return;if(!(S.tb[x.k]>=+x.t))S.tb[x.k]=+x.t;const o=db[col].find(y=>String(y.k)===k);if(o&&(+o._u||0)<=+x.t)D.push([col,o.k])});
 await pAll(D,([c,k])=>{db[c]=db[c].filter(y=>String(y.k)!==String(k));return rmRaw(c,String(k))});sySave();return D.length}
/* GitHub */
const ghNorm=r=>{const m=/^(?:https?:\/\/github\.com\/)?([\w.-]+)\/([\w.-]+?)(?:\.git)?\/?$/.exec(String(r||"").trim());return m?m[1]+"/"+m[2]:""};
const ghOn=()=>{const c=sy().gh;return !!(ghNorm(c.repo)&&c.token)};
const ghD=()=>String(sy().gh.dir||"data").replace(/^\/+|\/+$/g,"");
const ghP=n=>(ghD()?ghD()+"/":"")+n+".json";
const ghB=()=>encodeURIComponent(sy().gh.branch||"main");
const ghReq=(p,o={})=>{const g=sy().gh;return fetch("https://api.github.com/repos/"+g.repo+(p?"/"+p:""),{...o,headers:{Authorization:"Bearer "+g.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(o.headers||{})}})};
async function ghErr(r){let m="";try{m=(await r.json()).message}catch(e){}return new Error("GitHub "+r.status+(m?" – "+m:""))}
async function ghList(){const r=await ghReq("contents"+(ghD()?"/"+ghD():"")+"?ref="+ghB());if(r.status===404)return[];if(!r.ok)throw await ghErr(r);const j=await r.json();return Array.isArray(j)?j.filter(e=>e.type==="file"&&/\.json$/.test(e.name)):[]}
async function ghPull(){const S=sy(),L=await ghList();let n=0;
 L.sort((a,b)=>(b.name==="_deleted.json")-(a.name==="_deleted.json"));
 for(const e of L){const name=e.name.slice(0,-5),col=name==="_deleted"?"_deleted":syCol(name);if(!col)continue;if(S.sha[name]===e.sha)continue;
  const r2=await ghReq("contents/"+ghP(name)+"?ref="+ghB(),{headers:{Accept:"application/vnd.github.raw+json"}});if(!r2.ok)throw await ghErr(r2);
  const txt=await r2.text();let it;try{it=JSON.parse(txt)}catch(x){throw new Error("File "+name+".json rusak")}
  n+=col==="_deleted"?await syMergeTb(it):await syMerge(col,it);
  S.sha[name]=e.sha;S.h[name]=await th(syTxt(Array.isArray(it)?it:Object.values(it||{})));sySave()}return n}
async function ghPush(force){const S=sy(),F=syFiles(),rem=await ghList(),rs={};rem.forEach(e=>rs[e.name.slice(0,-5)]=e.sha);let n=0;
 rem.forEach(e=>{const nm=e.name.slice(0,-5);if(!(nm in F)&&nm!=="_deleted"&&syCol(nm)&&S.sha[nm])F[nm]=[]});
 for(const name in F){const txt=syTxt(F[name]),h=await th(txt);if(!force&&S.h[name]===h&&rs[name])continue;
  if(rs[name]&&S.sha[name]!==rs[name]){const ce=new Error("Data di GitHub berubah, digabung ulang…");ce.conflict=1;throw ce}
  const r=await ghReq("contents/"+ghP(name),{method:"PUT",body:JSON.stringify({message:"rb: "+name+" · "+((me&&me.u)||"sistem"),content:b64enc(txt),branch:S.gh.branch||"main",...(rs[name]?{sha:rs[name]}:{})})});
  if(r.status===409||r.status===422){const ce=await ghErr(r);ce.conflict=1;throw ce}
  if(!r.ok)throw await ghErr(r);const j=await r.json();S.sha[name]=j.content&&j.content.sha;S.h[name]=h;n++;sySave()}return n}

async function ghFull(quiet,o){o=o||{};if(syBusy||!ghOn())return false;syBusy=1;const S=sy(),c=S.gh,v0=syVer;ghBadge();let np=0,nq=0;
 try{if(o.fp)S.sha={};
  for(let a=0;a<3;a++){try{if(o.pull!==false)np=await ghPull();if(o.push!==false)nq=await ghPush(o.fq);break}catch(e){if(e.conflict&&a<2)continue;throw e}}

 finally{syBusy=0;syMsg();ghBadge()}
 return c.ok===1}

async function syExp(){const o={app:"rb",v:1,t:Date.now()};SYC.forEach(c=>o[c]=db[c]);await saveBlob(new Blob([JSON.stringify(o)],{type:"application/json"}),"Backup_"+today()+".json")}
function syImp(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=async e=>{try{const o=JSON.parse(e.target.result);if(!o||o.app!=="rb")throw 0;if(!confirm("Pulihkan data dari file ini? Data dengan kunci sama akan ditimpa, data lain tetap ada."))return;let n=0;for(const c of SYC)if(Array.isArray(o[c]))n+=await syMerge(c,o[c],true);el.value="";toast(n+" data dipulihkan ✓");applyLook();render()}catch(x){toast("File backup tidak valid")}};rd.readAsText(f)}
function ghCard(){return `<h2 style="margin-top:18px">Simpan ke GitHub</h2><p style="color:var(--mt);margin:0 0 8px">Data dan foto disimpan otomatis ke GitHub. Saat pindah perangkat, tekan tombol di bawah untuk memastikan semuanya sudah tersimpan atau terambil.</p><div class="row"><button onclick="ghNow().then(vBackup)">Simpan &amp; Sinkron Sekarang</button><button class="g" onclick="ghPullNow().then(vBackup)">Ambil dari GitHub</button></div><div class="msg ${sy().gh.ok?"ok":""}">${esc(ghOn()?syMsgT():"GitHub belum terhubung. Admin: Pengaturan → Sync Database, atau tombol “Hubungkan GitHub” di halaman login.")}</div>`}
function extTab(){const g=sy().gh,o=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?"selected":""}>${l}</option>`;
 return `<h2 style="margin-top:20px">Sinkron GitHub (penyimpanan data &amp; foto)</h2><p style="color:var(--mt)">GitHub menjadi penyimpanan utama: seluruh data dan foto (profil, logo, background) tersimpan otomatis ±5 detik setelah ada perubahan, dan data dari perangkat lain diambil otomatis. Penghapusan ikut tersinkron, dan setiap perubahan tercatat sebagai commit sehingga bisa dipulihkan dari riwayat GitHub. Di perangkat baru, isi pengaturan ini sekali (atau pakai tombol “Hubungkan GitHub” di halaman login); data akan terambil otomatis.</p>
 <div class="card" style="box-shadow:none"><div class="grid"><div><label>Repository (akun/repo atau URL)</label><input id="gh_repo" value="${esc(g.repo||"")}" placeholder="akun/repo-data" autocomplete="off"></div><div><label>Branch</label><input id="gh_br" value="${esc(g.branch||"main")}"></div><div><label>Folder data</label><input id="gh_dir" value="${esc(g.dir===undefined?"data":g.dir)}"></div><div><label>Token (github_pat_…)</label><input id="gh_tok" type="password" value="${esc(g.token||"")}" autocomplete="off"></div><div><label>Mode</label><select id="gh_mode">${o("auto","Otomatis (simpan saat ada perubahan + ambil berkala)",g.mode||"auto")}${o("manual","Manual saja (tombol di bawah)",g.mode||"auto")}</select></div><div><label>Ambil data terbaru tiap</label><select id="gh_iv">${o(30,"30 detik",g.iv||60)}${o(60,"1 menit",g.iv||60)}${o(300,"5 menit",g.iv||60)}</select></div></div>
 <div class="row"><button onclick="syTest('gh_')">Simpan &amp; Tes Koneksi</button><button class="g" onclick="ghNow().then(vSet)">Simpan &amp; Sinkron Sekarang</button><button class="g" onclick="ghPullNow()">Ambil dari GitHub</button><button class="g" onclick="ghResetPull()">Ambil Ulang Semua</button><button class="g" onclick="ghForcePush()">Kirim Ulang Semua</button><button class="r" onclick="syOff()">Putuskan</button></div><div id="sy_gh" class="msg ${g.ok?"ok":""}">${esc(syMsgT())}</div></div>
 <div class="card" style="box-shadow:none"><h2>Manual (file JSON)</h2><p style="margin:0 0 8px;color:var(--mt)">Cadangan lengkap ke satu file JSON dan pulihkan kapan saja. Berfungsi tanpa GitHub.</p><div class="row"><button onclick="syExp()">Download Backup JSON</button><button class="g" onclick="$('#sy_f').click()">Pulihkan dari File JSON</button><input id="sy_f" type="file" accept=".json,application/json" class="hide" onchange="syImp(this)"></div></div>
 <details style="margin:8px 0"><summary style="cursor:pointer;color:var(--mt)">Panduan &amp; peringatan keamanan</summary><ol style="margin:6px 0 0 18px;line-height:1.6"><li>Buat fine-grained token GitHub, pilih satu repo (disarankan <b>privat</b>), izin <b>Contents: Read and write</b>.</li><li>Token hanya disimpan di perangkat ini, tidak masuk ke database bersama maupun ke GitHub.</li><li>Repo publik membuka seluruh data (nama, nopeg, no kartu, hash password, foto) untuk umum.</li><li>Fitur ini butuh akses ke api.github.com: jalankan file dari hosting sendiri (mis. GitHub Pages) atau langsung dari komputer, bukan dari dalam halaman claude.ai.</li></ol></details>`}
(function(){let t=null;const rs=()=>{if(t){t.style.transform="";t=null}};addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const c=e.target.closest&&e.target.closest(".login .card,.stat");if(c!==t)rs();if(!c)return;t=c;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,k=c.classList.contains("stat")?10:3;c.style.transform=`perspective(900px) rotateY(${x*k}deg) rotateX(${-y*k}deg)`});document.addEventListener("pointerleave",rs,true)})();
$("#app").innerHTML='<p style="padding:20px">Memuat…</p>';init();
